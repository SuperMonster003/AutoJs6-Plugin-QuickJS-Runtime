name: Build integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Source, unit, lint, and APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned native toolchain
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Verify sources, documentation, and version build
        run: |
          python3 -B tools/quickjs/verify_source.py
          python3 -B -m unittest discover -s tools/quickjs/tests -p "test_*.py"
          python3 -B .python/generate_markdown.py --check
          version_ref="${{ github.event.pull_request.head.sha || github.sha }}"
          expected_build="$(git rev-list --count "$version_ref")"
          actual_build="$(sed -n 's/^VERSION_BUILD=//p' version.properties)"
          test "$actual_build" = "$expected_build"

      - name: Run tests, lint, and verify debug APKs
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:verifyDebugApkVariants \
            --stacktrace

      - name: Upload debug and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: quickjs-runtime-debug-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  instrumentation:
    name: Binder and QuickJS round trip (API ${{ matrix.api_level }}, x86_64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api_level: [24, 35]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned native toolchain
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew connectedDebugAndroidTest -PrequiredApiLevel=${{ matrix.api_level }} --stacktrace

  verify-16kb:
    name: Binder and QuickJS round trip (API 35, 16 KB pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download verified debug APKs
        uses: actions/download-artifact@v8
        with:
          name: quickjs-runtime-debug-apks
          path: ci-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify runtime on 16 KB pages
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_7
          script: bash .github/scripts/verify-16kb.sh
